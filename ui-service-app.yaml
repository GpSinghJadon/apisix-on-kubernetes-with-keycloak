apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service-app
  labels:
    app: ui-service-app # Changed to 'app' to match service selector
spec:
  selector:
    matchLabels:
      app: ui-service-app # Added matchLabels
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ui-service-app
        app_type: frontend
    spec:
      containers:
        - image: gpsingh9999/pocs:ui-service-app
          name: ui-service-app
          resources:
            requests:
              cpu: "200m"
              memory: "550M"
            limits: # Added limits
              cpu: "400m"
              memory: "750M"
          ports:
            - containerPort: 80
              name: ui-service-app
          imagePullPolicy: Always # Moved to container level
      restartPolicy: Always
# ---
# apiVersion: v1 # Added apiVersion for Service
# kind: Service
# metadata:
#   name: ui-service-app
# spec:
#   selector:
#     app: ui-service-app
#   type: NodePort
#   ports:
#     - port: 80
#       targetPort: 80
#       nodePort: 31686
#       protocol: TCP
---
apiVersion: v1 # Added apiVersion for Service
kind: Service
metadata:
  name: ui-service-app
spec:
  selector:
    app: ui-service-app
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
