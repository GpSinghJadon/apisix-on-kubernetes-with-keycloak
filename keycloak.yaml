apiVersion: v1
kind: Namespace
metadata:
  name: auth-poc
  labels:
    environment: development
    team: authentication
---
apiVersion: v1
kind: Secret
metadata:
  name: env-secrets
  namespace: auth-poc  # Keep the secret in api-poc for now
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: password
  KEYCLOAK_DB_NAME: keycloakdb
  KEYCLOAK_DB_USER: postgres
  KEYCLOAK_DB_PASSWORD: postgres
  # APISIX_ADMIN_KEY: edd1c9f034335f136f87ad84b625c8f1

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: auth-poc
data:
  init.sql: |
    CREATE USER keycloak WITH PASSWORD 'keycloak';
    CREATE DATABASE keycloakdb;
    GRANT ALL PRIVILEGES ON DATABASE keycloakdb TO keycloak;
    \c keycloakdb;
    GRANT ALL ON SCHEMA public TO keycloak;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO keycloak;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL PRIVILEGES ON TABLES TO keycloak;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: auth-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15.5
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: env-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            limits:
              cpu: 1000m
              memory: 1024Mi
            requests:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: postgres-init
          configMap:
            name: postgres-init

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: auth-poc
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: auth-poc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: auth-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: bitnami/keycloak:22.0.5 # Specific version
        resources:
          limits:
            cpu: 1000m
            memory: 1024Mi
          requests:
            cpu: 500m
            memory: 512Mi
        # Update in Keycloak deployment env section:
        env:
        - name: KEYCLOAK_ADMIN_USER  # Changed from KC_BOOTSTRAP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: KC_BOOTSTRAP_ADMIN_USERNAME
        - name: KEYCLOAK_ADMIN_PASSWORD  # Changed from KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: KC_BOOTSTRAP_ADMIN_PASSWORD
        - name: KEYCLOAK_DATABASE_HOST  # Changed from DB_ADDR
          value: postgres
        - name: KEYCLOAK_DATABASE_PORT  # Changed from DB_PORT
          value: "5432"
        - name: KEYCLOAK_DATABASE_NAME
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: KEYCLOAK_DB_NAME
        - name: KEYCLOAK_DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: KEYCLOAK_DB_USER
        - name: KEYCLOAK_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: env-secrets
              key: KEYCLOAK_DB_PASSWORD
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9990
          name: management
        livenessProbe:  # Added liveness probe
          httpGet:
            path: /realms/master
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe: # Added readiness probe
          httpGet:
            path: /realms/master
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: auth-poc
spec:
  type: NodePort
  ports:
  - name: http
    protocol: TCP
    port: 8080
    targetPort: http
    nodePort: 30081
  selector:
    app: keycloak

---
